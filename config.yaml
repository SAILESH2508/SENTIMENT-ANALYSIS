# Universal Sentiment Analyzer Configuration

# Model Configuration
model:
  path: "sentiment_pipeline.pkl"
  metrics_path: "model_metrics.pkl"
  
  # Sentiment classification thresholds
  thresholds:
    intermediate_lower: 0.40
    intermediate_upper: 0.60
  
  # Training parameters
  training:
    test_size: 0.2
    random_state: 42
    max_iter: 1000
    c_value: 1.0
    ngram_range: [1, 2]

# Text Processing
text:
  min_length: 4
  max_length: 10000
  max_url_content: 5000

# Logging
logging:
  level: "INFO"
  file: "sentiment_analyzer.log"
  log_predictions: true
  max_log_size_mb: 10

# UI Configuration
ui:
  page_title: "Universal Sentiment Analyzer"
  page_icon: "🧠"
  theme:
    primary_color: "#002B5B"
    background_color: "#FFFFFF"
    secondary_color: "#E0E0E0"

# Performance
performance:
  cache_predictions: true
  cache_ttl_seconds: 3600
  batch_size: 100
  max_concurrent_requests: 10

# Security
security:
  rate_limit_per_minute: 60
  max_file_size_mb: 10
  allowed_file_types: [".csv", ".txt"]
  
# Translation
translation:
  cache_enabled: true
  max_text_length: 1000
  timeout_seconds: 10